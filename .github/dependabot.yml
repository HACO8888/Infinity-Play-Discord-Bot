version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      # 型別版本要跟執行環境的 Node 24 一致，大版本跟著 Node 一起升
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
